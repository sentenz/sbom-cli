# SPDX-License-Identifier: Apache-2.0

name: Python Tests Component
description: Composite action to run Python test setup, coverage tests, teardown, and artifact upload.

inputs:
  job:
    description: Name used for uploaded artifacts.
    required: false
    default: python-tests
  artifacts_paths:
    description: Files and directories to attach as artifacts.
    required: false
    default: logs/
  artifacts_retention_days:
    description: Number of days to keep uploaded artifacts.
    required: false
    default: "1"
  allow_failure:
    description: Allow test execution to fail without failing the step.
    required: false
    default: "false"
  before_task:
    description: Task to prepare the environment before tests.
    required: false
    default: make test-setup
  task:
    description: Task to execute the Python test suite.
    required: false
    default: make test-coverage
  after_task:
    description: Task to clean up the environment after tests.
    required: false
    default: make test-teardown

runs:
  using: composite
  steps:
    - name: Install build prerequisites
      shell: bash
      run: |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y --no-install-recommends make

    - name: Run test setup
      shell: bash
      run: |
        set -euo pipefail
        ${{ inputs.before_task }}

    - name: Run coverage tests
      shell: bash
      continue-on-error: ${{ inputs.allow_failure == 'true' }}
      run: |
        set -euo pipefail
        ${{ inputs.task }}

    - name: Run test teardown
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        ${{ inputs.after_task }}

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.job }}-artifacts
        path: ${{ inputs.artifacts_paths }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifacts_retention_days }}
