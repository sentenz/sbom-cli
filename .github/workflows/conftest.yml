# SPDX-License-Identifier: Apache-2.0

name: Conftest

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "tests/policy/**"
      - "conftest.toml"
      - ".github/workflows/conftest.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "tests/policy/**"
      - "conftest.toml"
      - ".github/workflows/conftest.yml"

permissions: {}

jobs:
  conftest:
    name: Conftest Policy Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dockerfile policy
        uses: sentenz/actions/conftest@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          path: Dockerfile
          policy-path: ./tests/policy
          config-file: ./conftest.toml
          fail-on-warn: "true"
          all-namespaces: "false"

      - name: Check Python project policy
        uses: sentenz/actions/conftest@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          path: pyproject.toml
          policy-path: ./tests/policy
          config-file: ./conftest.toml
          fail-on-warn: "true"
          all-namespaces: "false"
