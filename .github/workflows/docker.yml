name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - ".github/workflows/docker.yml"
  workflow_call:
    inputs:
      publish:
        description: Publish the container image to GHCR
        required: true
        type: boolean
      version:
        description: Container image version and existing Git release tag (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Docker Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        uses: sentenz/actions/docker@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          version: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          context: .
          file: Dockerfile
          image-name: sbom-cli
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Docker Action - Publish
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Publish attested container image to GHCR
        id: docker-build
        uses: sentenz/actions/docker@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          version: ${{ inputs.version }}
          context: .
          file: Dockerfile
          image-name: sbom-cli
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and Verify
        uses: sentenz/actions/sigstore@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          image: ${{ steps.docker-build.outputs.image }}@${{ steps.docker-build.outputs.digest }}
          identity: ${{ github.server_url }}/${{ job.workflow_ref }}

      - name: Retain Verification Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-signature-${{ inputs.version }}-${{ github.run_attempt }}
          path: image.sigstore.json
          if-no-files-found: error
          retention-days: 90
