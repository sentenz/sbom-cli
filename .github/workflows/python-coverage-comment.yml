# SPDX-License-Identifier: Apache-2.0

name: Python Fork Coverage Comment

on:
  workflow_run:
    workflows: [Python Tests]
    types: [completed]

permissions: {}

concurrency:
  group: python-coverage-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    # workflow_run uses the default-branch workflow, even for forked PRs.
    # Never check out PR code or execute any downloaded artifact in this job.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/python-tests.yml' &&
      github.event.workflow_run.repository.id == github.event.repository.id &&
      github.event.workflow_run.head_repository.id != github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Resolve current pull request and test artifact
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            // workflow_run.pull_requests can be empty for forks. Resolve via GitHub,
            // never a PR number supplied inside an untrusted artifact.
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: run.head_sha, per_page: 100
            });
            const matches = pulls.filter(pr =>
              pr.state === 'open' &&
              pr.base.repo.id === context.payload.repository.id &&
              pr.head.repo?.id === run.head_repository.id &&
              pr.head.ref === run.head_branch &&
              pr.head.sha === run.head_sha
            );
            if (matches.length !== 1) {
              core.info('No unique open PR at this commit; skipping stale or unrelated coverage.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const artifact = artifacts.find(item => item.name === 'python-tests-artifacts' && !item.expired);
            if (!artifact) {
              core.info('No test artifact is available; skipping coverage comment.');
              return;
            }
            core.setOutput('number', matches[0].number);
            core.setOutput('artifact-id', artifact.id);

      - name: Download reports from the triggering test run
        if: steps.report.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.report.outputs.artifact-id }}
          path: reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify current commit and add report provenance
        id: current
        if: steps.report.outputs.number != '' && hashFiles('reports/coverage-summary.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.report.outputs.number }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.info('PR changed while downloading coverage; skipping stale report.');
              return;
            }
            const fs = require('node:fs');
            fs.appendFileSync('reports/coverage-summary.md',
              `\n\n${run.conclusion === 'success' ? '✅' : '❌'} Test workflow: **${run.conclusion}**. ` +
              `${run.conclusion === 'success' ? '' : 'Coverage may be incomplete. '}\n\n` +
              `Commit: \`${run.head_sha}\` · [Test run](${run.html_url})\n`);
            core.setOutput('publish', 'true');

      - name: Update coverage pull request comment
        if: steps.current.outputs.publish == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ steps.report.outputs.number }}
          header: python-coverage
          path: reports/coverage-summary.md
