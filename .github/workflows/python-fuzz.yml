# SPDX-License-Identifier: Apache-2.0

name: Python Coverage-Guided Fuzzing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-guided-fuzz:
    name: Atheris project lookup fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends make

      - name: Install package and Atheris
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -e ".[fuzz]"

      - name: Run bounded coverage-guided campaign
        run: |
          set -euo pipefail
          make test-fuzz-guided

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-guided-fuzz-failures
          path: logs/fuzz/
          if-no-files-found: ignore
          retention-days: 7
