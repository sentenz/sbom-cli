# SPDX-License-Identifier: Apache-2.0

name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Python tests component
        uses: ./.github/actions/python-tests
        with:
          job: python-tests
          artifacts_paths: logs/
          artifacts_retention_days: "30"
          allow_failure: "false"
          before_task: make test-setup
          task: make test-coverage
          after_task: make test-teardown

  coverage-comment:
    name: Comment coverage on PR
    needs: python-tests
    # Do not grant write permissions to the job executing PR code. Forks get
    # the read-only Actions summary/artifacts; no pull_request_target is used.
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download test report
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-artifacts
          path: logs/

      - name: Publish or update coverage comment
        if: steps.reports.outcome == 'success' && hashFiles('logs/coverage-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: python-coverage
          path: logs/coverage-summary.md
