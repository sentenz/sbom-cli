# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release token
        id: auth
        shell: python
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          import os

          token = os.environ['RELEASE_TOKEN'].strip()
          if not token or any(c.isspace() for c in token):
              raise SystemExit('RELEASE_TOKEN must contain a single token')
          print(f'::add-mask::{token}', flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'token={token}', file=output)

      - name: Run Semantic Release
        uses: sentenz/actions/semantic-release@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          github-token: ${{ steps.auth.outputs.token }}
          semantic-version: "25.0.3"
