# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-tag: ${{ steps.release.outputs.new-release-git-tag }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Retained: the existing release config uses @semantic-release/git.
          persist-credentials: true

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@ac68a6837f8890c4570767c0d1f21bcfc133ab1a # 1.5.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          semantic-version: "25.0.3"

  sbom:
    name: Generate and publish release SBOMs
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ needs.semantic-release.outputs.new-release-tag }}

  docker:
    name: Build and publish release container image
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
      version: ${{ needs.semantic-release.outputs.new-release-tag }}
