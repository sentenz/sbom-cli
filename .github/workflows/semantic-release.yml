# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-tag: ${{ steps.release.outputs.new-release-git-tag }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          semantic-version: "25.0.3"

  docker:
    name: Build and publish release container image
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-sigstor.yml
    with:
      publish: true
      version: ${{ needs.semantic-release.outputs.new-release-tag }}
