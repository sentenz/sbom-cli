# SPDX-License-Identifier: Apache-2.0

name: SBOM

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git release tag (for example, v1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: sbom-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate, Scan, Sign and Publish Release SBOMs
    if: github.event_name == 'workflow_dispatch' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.version) }}
          persist-credentials: false

      - name: Generate SBOM (CycloneDX)
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Generate SBOM (SPDX)
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Scan SBOM (SPDX)
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          exit-code: "1"
          scan-type: sbom
          scan-target: sbom.spdx.json
        continue-on-error: false

      - name: Scan SBOM (CycloneDX)
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          exit-code: "1"
          scan-type: sbom
          scan-target: sbom.cdx.json
        continue-on-error: false

      - name: Sign and Verify Artifacts
        uses: sentenz/actions/sigstore@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          identity: ${{ github.server_url }}/${{ github.workflow_ref }}
          files: |
            sbom.cdx.json
            sbom.spdx.json

      - name: Publish Release Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
