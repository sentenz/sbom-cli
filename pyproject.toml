[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom"
version = "1.0.0"
description = "Client and CLI for SBOM operations"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
  "configargparse==1.10.1",
  "requests==2.34.2",
  "types-requests==2.33.0.20261030",
  "urllib3==2.8.0",
  "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sbom = "sbom.cli:main"

[project.optional-dependencies]
docs = [
  "zensical==0.1.3",
  "mkdocstrings[python]==1.0.8",
  "mkdocstrings-python==2.0.11",
]
fuzz = [
  "atheris==3.1.0",
]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.15",
  "atheris==3.1.0",
  "isort==9.0.2",
  "black==26.10.1",
  "flake8==7.5.0",
  "mypy==2.4.1",
  "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast, isolated unit tests (no network)",
  "fuzz: property-based / fuzz tests (hypothesis)",
  "integration: tests that exercise multiple components together",
  "e2e: end-to-end tests against a live server (deselected by default)",
]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
lint.extend-ignore = ["E203"]
lint.select = ["E", "F", "W", "C90", "D", "D107", "D400", "D401"]
lint.pydocstyle.convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
